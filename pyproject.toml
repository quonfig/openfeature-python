[tool.poetry]
name = "quonfig-openfeature"
version = "0.0.8"
description = "OpenFeature provider for Quonfig — Python server-side SDK"
license = "MIT"
authors = ["Quonfig <hello@quonfig.com>"]
readme = "README.md"
packages = [{include = "quonfig_openfeature"}]

[tool.poetry.dependencies]
# Floor raised to 3.10 to track the `quonfig` SDK, which dropped Python 3.9
# support in 0.0.15.
python = ">=3.10,<4.0"
# Runtime dependency on the Quonfig Python SDK, resolved from the published
# `quonfig` distribution on PyPI.
quonfig = ">=0.0.17"
openfeature-sdk = ">=0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-mock = "^3.0"
ruff = "^0.4"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
