[tool.poetry]
name = "quonfig-openfeature"
version = "3.1.0"
description = "OpenFeature provider for Quonfig — Python server-side SDK"
license = "MIT"
authors = ["Quonfig <hello@quonfig.com>"]
readme = "README.md"
packages = [{include = "quonfig_openfeature"}]

[tool.poetry.dependencies]
# Floor raised to 3.10 to track the `quonfig` SDK, which dropped Python 3.9
# support in 0.0.15.
python = ">=3.10,<4.0"
# Runtime dependency on the Quonfig Python SDK, resolved from the published
# `quonfig` distribution on PyPI. Floor 3.1.0: PARSE_ERROR for a malformed
# value in the *_details getters, and evaluate_details (the stored-form read
# behind duration-as-ISO-text) (qfg-wg1n, qfg-pwrv). 3.0.0: the cross-SDK typed-getter
# contract (qfg-zvyy.5): no string coercion, safe int<->float only, a failed
# read returns the default. 2.1.0 brought size caps and fork-child init failure
# raises (qfg-6vno); 2.0.0 blocking init and the on_init_failure "fail" default
# (qfg-9p4i.12). Keep this a bare ">=" floor: release.yaml parses it to wait
# for that version on PyPI.
quonfig = ">=3.1.0"
openfeature-sdk = ">=0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-mock = "^3.0"
ruff = "^0.4"
mypy = ">=1,<3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
